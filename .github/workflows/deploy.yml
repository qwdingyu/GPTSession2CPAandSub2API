name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ai-eforge
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PRODUCTION_URL: https://ai.eforge.xyz/

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preflight
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Test, deploy, and verify production
        run: npm run deploy:ci
